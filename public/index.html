<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#111827">
  <title>AI Prompt Gallery</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/" data-link>
      <span class="brand-mark">AI</span>
      <span><b id="brandTitle">Prompt Gallery</b><small>AUTO TABLE SYNC</small></span>
    </a>
    <nav id="sideNav" class="side-nav"></nav>
    <div class="side-foot"><span class="sync-dot"></span><span id="syncText">等待同步</span></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="topbarTitle">首页</div>
      <div class="topbar-actions">
        <span class="sync-time" id="lastSync"></span>
        <button class="btn ghost" id="refreshBtn">↻ 同步</button>
        <button class="btn primary hidden" id="newPromptBtn">＋ 新增提示词</button>
      </div>
    </header>
    <div id="toast" class="toast hidden"></div>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="overlay" class="overlay hidden"><section id="modal" class="modal" role="dialog" aria-modal="true"></section></div>
<script src="/app.js"></script>
</body>
</html>
